<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">An inspectable AutoDesign run</title>
  <desc id="desc">A source document is ingested, authored as editable HTML, checked in a browser quality loop, and promoted with manifests and previews.</desc>

  <rect width="1200" height="470" rx="24" fill="#151515"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="54" y="52" fill="#C65A4E" font-size="17" font-weight="700" letter-spacing="2">ONE RUN / INSPECTABLE BY DESIGN</text>
    <text x="1146" y="52" fill="#827D75" font-size="16" text-anchor="end">SOURCE → AUTHOR → VALIDATE → PROMOTE</text>
  </g>

  <g transform="translate(54 86)">
    <rect width="260" height="300" rx="14" fill="#F4F1EA"/>
    <text x="22" y="38" fill="#9B3A32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01 / SOURCE</text>
    <text x="22" y="75" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="720">Paper evidence</text>
    <rect x="22" y="99" width="216" height="137" rx="5" fill="#FFFDF9" stroke="#CFC7BB"/>
    <rect x="38" y="117" width="113" height="8" rx="4" fill="#252525"/>
    <rect x="38" y="136" width="178" height="5" rx="2.5" fill="#AAA296"/>
    <rect x="38" y="148" width="162" height="5" rx="2.5" fill="#AAA296"/>
    <rect x="38" y="166" width="76" height="51" rx="2" fill="#6D8790"/>
    <rect x="126" y="166" width="90" height="6" rx="3" fill="#AAA296"/>
    <rect x="126" y="179" width="82" height="6" rx="3" fill="#AAA296"/>
    <rect x="126" y="192" width="86" height="6" rx="3" fill="#AAA296"/>
    <text x="22" y="266" fill="#5F5951" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">claims · figures · tables</text>
    <text x="22" y="289" fill="#5F5951" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">provenance beside the run</text>
  </g>

  <path d="M330 236H370" stroke="#C65A4E" stroke-width="2"/>
  <path d="M362 228L370 236L362 244" fill="none" stroke="#C65A4E" stroke-width="2"/>

  <g transform="translate(386 86)">
    <rect width="428" height="300" rx="14" fill="#242424" stroke="#3D3D3D"/>
    <text x="22" y="38" fill="#C65A4E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02 / EDITABLE AUTHORING</text>
    <text x="22" y="75" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="720">HTML/CSS with named layers</text>
    <rect x="22" y="99" width="384" height="128" rx="8" fill="#111111"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="40" y="128" fill="#827D75">01</text>
      <text x="70" y="128" fill="#9FB3B9">&lt;section</text>
      <text x="141" y="128" fill="#E6C784">data-layer</text>
      <text x="233" y="128" fill="#F4F1EA">="method"&gt;</text>
      <text x="40" y="155" fill="#827D75">02</text>
      <text x="70" y="155" fill="#9FB3B9">  &lt;figure</text>
      <text x="160" y="155" fill="#E6C784">data-source</text>
      <text x="264" y="155" fill="#F4F1EA">="fig_03" /&gt;</text>
      <text x="40" y="182" fill="#827D75">03</text>
      <text x="70" y="182" fill="#9FB3B9">  &lt;table</text>
      <text x="151" y="182" fill="#E6C784">data-layer</text>
      <text x="243" y="182" fill="#F4F1EA">="results" /&gt;</text>
      <text x="40" y="209" fill="#827D75">04</text>
      <text x="70" y="209" fill="#9FB3B9">&lt;/section&gt;</text>
    </g>
    <g transform="translate(22 246)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="650">
      <rect width="124" height="32" rx="16" fill="#F4F1EA"/>
      <text x="62" y="21" fill="#242424" text-anchor="middle">native text</text>
      <rect x="134" width="120" height="32" rx="16" fill="#F4F1EA"/>
      <text x="194" y="21" fill="#242424" text-anchor="middle">real tables</text>
      <rect x="264" width="120" height="32" rx="16" fill="#F4F1EA"/>
      <text x="324" y="21" fill="#242424" text-anchor="middle">local assets</text>
    </g>
  </g>

  <path d="M830 236H870" stroke="#C65A4E" stroke-width="2"/>
  <path d="M862 228L870 236L862 244" fill="none" stroke="#C65A4E" stroke-width="2"/>

  <g transform="translate(886 86)">
    <rect width="260" height="300" rx="14" fill="#F4F1EA"/>
    <text x="22" y="38" fill="#9B3A32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03 / PROMOTED FINAL</text>
    <text x="22" y="75" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="720">Browser-checked</text>
    <rect x="22" y="99" width="216" height="118" rx="5" fill="#FFFDF9" stroke="#171717" stroke-width="1.5"/>
    <rect x="32" y="109" width="196" height="22" rx="2" fill="#171717"/>
    <rect x="32" y="141" width="55" height="66" rx="2" fill="#E5DED2"/>
    <rect x="93" y="141" width="55" height="66" rx="2" fill="#EFE9DF"/>
    <rect x="154" y="141" width="74" height="66" rx="2" fill="#E5DED2"/>
    <path d="M163 193L174 181L184 187L195 169L217 189" fill="none" stroke="#6D8790" stroke-width="3"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="22" y="249" fill="#5F5951">final/poster.html</text>
      <text x="22" y="272" fill="#5F5951">final/preview.png</text>
      <text x="22" y="295" fill="#5F5951">run_events.jsonl</text>
    </g>
  </g>

  <g transform="translate(54 426)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text fill="#827D75">Validation remains centralized · fallbacks stay labeled · artifacts remain local</text>
    <circle cx="1080" cy="-6" r="6" fill="#6F9A79"/>
    <text x="1096" y="0" fill="#C9D6CC">PASS</text>
  </g>
</svg>
